{% extends "base.html" %}
{% set title = 'Login' %}
{% block head %}
<style>
/* Animated UUID login - grid pulse theme */
@keyframes uuidPulse {
  0%, 100% { box-shadow: 0 0 28px rgba(61,240,255,.3), 0 0 8px rgba(183,255,61,.1); }
  50% { box-shadow: 0 0 50px rgba(61,240,255,.55), 0 0 20px rgba(183,255,61,.2); }
}
@keyframes uuidScan {
  0% { background-position: -200% 0; }
  100% { background-position: 200% 0; }
}
@keyframes fadeSlideUp {
  from { opacity: 0; transform: translateY(24px) scale(.97); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}
@keyframes ringSpin {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}
.uuid-login {
  animation: fadeSlideUp .6s cubic-bezier(.2,.8,.2,1);
}
.uuid-ring {
  width: 100px; height: 100px; margin: 0 auto 20px;
  border-radius: 50%;
  border: 2px solid rgba(61,240,255,.3);
  display: grid; place-items: center;
  position: relative;
  animation: uuidPulse 3s ease-in-out infinite;
}
.uuid-ring::before {
  content: '';
  position: absolute; inset: -4px;
  border-radius: 50%;
  border: 1px dashed rgba(183,255,61,.2);
  animation: ringSpin 12s linear infinite;
}
.uuid-ring .icon {
  font-size: 36px; font-weight: 900;
  color: var(--glow);
  text-shadow: 0 0 20px rgba(61,240,255,.5);
}
.uuid-field {
  width: 100%;
  padding: 14px 18px;
  background: rgba(8,28,48,.6);
  border: 1px solid var(--line);
  border-radius: 12px;
  color: var(--text);
  font-family: ui-monospace, Consolas, monospace;
  font-size: 18px;
  letter-spacing: .06em;
  text-align: center;
  transition: border-color .3s, box-shadow .3s;
  outline: none;
}
.uuid-field:focus {
  border-color: var(--glow);
  box-shadow: 0 0 20px rgba(61,240,255,.25), inset 0 0 15px rgba(61,240,255,.08);
}
.uuid-field::placeholder {
  color: var(--muted);
  font-size: 14px;
  letter-spacing: .03em;
  opacity: .6;
}
.uuid-submit {
  width: 100%; margin-top: 16px;
  padding: 14px;
  background: linear-gradient(90deg, rgba(61,240,255,.25), rgba(183,255,61,.15));
  border: 1px solid var(--line);
  border-radius: 12px;
  color: var(--text);
  font-size: 16px;
  font-weight: 700;
  cursor: pointer;
  letter-spacing: .08em;
  transition: all .3s;
}
.uuid-submit:hover {
  background: linear-gradient(90deg, rgba(61,240,255,.4), rgba(183,255,61,.25));
  box-shadow: 0 0 25px rgba(61,240,255,.2);
  border-color: var(--glow);
}
.uuid-hint {
  color: var(--muted);
  font-size: 13px;
  margin-top: 14px;
  text-align: center;
  opacity: .7;
}
</style>
{% endblock %}
{% block content %}
<section class="uuid-login panel holo" style="width:min(480px,100%);margin:10vh auto;">
  <div class="uuid-ring">
    <div class="icon">&#9783;</div>
  </div>
  <h1 style="text-align:center;margin:0 0 4px;">Tower Access</h1>
  <p class="muted" style="text-align:center;margin:0 0 20px;">Authenticate with your grid UUID</p>
  <form method="post" class="stack" autocomplete="off">
    <input class="uuid-field" name="uuid" type="text"
      inputmode="text"
      placeholder="xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx"
      pattern="[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}"
      maxlength="36"
      required autofocus>
    <button class="uuid-submit" type="submit">&#9654; Authenticate</button>
  </form>
  <p class="uuid-hint">Enter your avatar UUID from the grid to access the firewall tower.</p>
</section>
{% endblock %}
