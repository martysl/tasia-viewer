name: Build Tasia Viewer - Linux

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publish GitHub pre-release"
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  AUTOBUILD_ADDRSIZE: 64
  AUTOBUILD_BUILD_ID: ${{ github.run_id }}
  AUTOBUILD_INSTALLABLE_CACHE: ${{ github.workspace }}/.autobuild-installables
  AUTOBUILD_VARIABLES_FILE: ${{ github.workspace }}/.build-variables/variables
  AUTOBUILD_VCS_INFO: "true"
  LL_SKIP_REQUIRE_SYSROOT: 1
  XZ_DEFAULTS: -T0
  BUILD_VARIABLES_REF: c17312d38377c003977cf5b6dcc83c6042eba194
  FMOD_RELEASE_TAG: fmod-20307

jobs:
  build:
    name: Build Tasia Viewer - Linux - FMOD
    runs-on: ubuntu-22.04
    timeout-minutes: 240

    steps:
      - name: Checkout Linux stable source
        uses: actions/checkout@v4
        with:
          ref: tasia_linux_stable_os
          fetch-depth: 0

      - name: Record source metadata
        shell: bash
        run: |
          set -euo pipefail

          SOURCE_SHA="$(git rev-parse HEAD)"
          SOURCE_SHORT_SHA="${SOURCE_SHA:0:7}"
          VIEWER_VERSION_BASE="$(tr -d '\r\n' < indra/newview/VIEWER_VERSION.txt)"

          if [[ ! "$VIEWER_VERSION_BASE" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid viewer version: $VIEWER_VERSION_BASE"
            exit 1
          fi

          {
            echo "SOURCE_BRANCH=tasia_linux_stable_os"
            echo "SOURCE_SHA=$SOURCE_SHA"
            echo "SOURCE_SHORT_SHA=$SOURCE_SHORT_SHA"
            echo "VIEWER_VERSION_BASE=$VIEWER_VERSION_BASE"
            echo "TASIA_DISPLAY_VERSION=${VIEWER_VERSION_BASE}.${GITHUB_RUN_NUMBER}"
            echo "TASIA_BUILD_NUMBER=${GITHUB_RUN_NUMBER}"
            echo "TASIA_SHORT_SHA=$SOURCE_SHORT_SHA"
            echo "VIEWER_VERSION_GITHASH=$SOURCE_SHA"
          } >> "$GITHUB_ENV"

          echo "Building tasia_linux_stable_os at $SOURCE_SHA"
          echo "Viewer version: ${VIEWER_VERSION_BASE}.${GITHUB_RUN_NUMBER}"

      - name: Preserve GitHub build number
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          path = Path("scripts/configure_firestorm.sh")
          text = path.read_text(encoding="utf-8")

          old = (
              "    buildVer=$(git rev-list --count HEAD)\n"
              "    export revision=${buildVer}"
          )
          new = (
              '    buildVer="${revision:-$(git rev-list --count HEAD)}"\n'
              '    export revision="${buildVer}"'
          )

          if old not in text:
              raise SystemExit(
                  "Expected revision block was not found in scripts/configure_firestorm.sh"
              )

          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Linux build dependencies
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            build-essential \
            gcc-11 \
            g++-11 \
            cmake \
            git \
            pkg-config \
            ninja-build \
            xz-utils \
            bzip2 \
            zstd \
            libssl-dev \
            mesa-common-dev \
            libgl1-mesa-dev \
            libglu1-mesa-dev \
            libpulse-dev \
            libxinerama-dev \
            libxrandr-dev \
            libfontconfig1-dev \
            libfreetype6-dev \
            libdbus-1-dev

          echo "CC=gcc-11" >> "$GITHUB_ENV"
          echo "CXX=g++-11" >> "$GITHUB_ENV"

          gcc-11 --version
          g++-11 --version
          cmake --version
          ninja --version

          sudo apt-get clean

      - name: Install pinned Python build tools
        shell: bash
        run: |
          set -euo pipefail

          python -m pip install --upgrade pip
          python -m pip install \
            "autobuild==3.10.2" \
            "llbase==1.3.1" \
            "llsd==1.2.4"

          PYTHON_PATH="$(python -c 'import sys; print(sys.executable)')"
          echo "PYTHON=$PYTHON_PATH" >> "$GITHUB_ENV"

          python --version
          autobuild --version
          python -m pip check

      - name: Checkout pinned build variables
        uses: actions/checkout@v4
        with:
          repository: FirestormViewer/fs-build-variables
          ref: ${{ env.BUILD_VARIABLES_REF }}
          path: .build-variables

      - name: Restore autobuild installables cache
        uses: actions/cache@v4
        with:
          path: ${{ env.AUTOBUILD_INSTALLABLE_CACHE }}
          key: autobuild-linux-${{ env.FMOD_RELEASE_TAG }}-${{ hashFiles('autobuild.xml') }}
          restore-keys: |
            autobuild-linux-${{ env.FMOD_RELEASE_TAG }}-
            autobuild-linux-

      - name: Download private FMOD autobuild package
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.FMOD_DEPS_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::FMOD_DEPS_TOKEN secret is missing."
            exit 1
          fi

          rm -rf private-deps
          mkdir -p private-deps

          gh release download "$FMOD_RELEASE_TAG" \
            --repo martysl/tasia-private-deps \
            --pattern "*linux64*.tar.bz2" \
            --dir private-deps

          FMOD_PACKAGE="$(
            find private-deps \
              -maxdepth 1 \
              -type f \
              -name '*linux64*.tar.bz2' \
              -print -quit
          )"

          if [ -z "$FMOD_PACKAGE" ]; then
            echo "::error::FMOD Linux autobuild package was not downloaded."
            exit 1
          fi

          tar -tjf "$FMOD_PACKAGE" >/dev/null

          FMOD_HASH="$(
            python3 -c \
              "import hashlib,sys; print(hashlib.md5(open(sys.argv[1],'rb').read()).hexdigest())" \
              "$FMOD_PACKAGE"
          )"

          FMOD_FILE_URL="$(
            python3 -c \
              "import pathlib,sys; print(pathlib.Path(sys.argv[1]).resolve().as_uri())" \
              "$FMOD_PACKAGE"
          )"

          {
            echo "FMOD_PLATFORM=linux64"
            echo "FMOD_PACKAGE=$FMOD_PACKAGE"
            echo "FMOD_HASH=$FMOD_HASH"
            echo "FMOD_FILE_URL=$FMOD_FILE_URL"
          } >> "$GITHUB_ENV"

          echo "Using FMOD package: $FMOD_PACKAGE"
          echo "FMOD MD5: $FMOD_HASH"

      - name: Point autobuild to private FMOD package
        shell: bash
        run: |
          set -euo pipefail

          autobuild installables edit fmodstudio \
            platform="$FMOD_PLATFORM" \
            hash="$FMOD_HASH" \
            url="$FMOD_FILE_URL"

      - name: Load autobuild environment
        shell: bash
        run: |
          set -eo pipefail

          autobuild source_environment > .source_env
          source .source_env

          {
            echo "LL_BUILD=${LL_BUILD:-}"
            echo "LL_BUILD_RELEASE=${LL_BUILD_RELEASE:-}"
          } >> "$GITHUB_ENV"

      - name: Configure Linux with FMOD
        shell: bash
        env:
          TASIA_GIPHY_API_KEY: ${{ secrets.TASIA_GIPHY_API_KEY }}
        run: |
          set -euo pipefail

          autobuild configure \
            -c ReleaseFS_open \
            -A "$AUTOBUILD_ADDRSIZE" \
            -- \
            --fmodstudio \
            --package \
            --ninja

      - name: Build Linux with FMOD
        shell: bash
        run: |
          set -euo pipefail

          autobuild build \
            -c ReleaseFS_open \
            -A "$AUTOBUILD_ADDRSIZE" \
            --no-configure \
            -- \
            --fmodstudio \
            --package \
            --ninja

      - name: Locate Linux package
        id: linux-package
        shell: bash
        run: |
          set -euo pipefail

          PACKAGE="$(
            find build-linux-x86_64/newview \
              -maxdepth 1 \
              -type f \
              \( -name '*.tar.xz' -o -name '*.tar.bz2' \) \
              ! -name '*symbols*' \
              -print -quit
          )"

          if [ -z "$PACKAGE" ]; then
            echo "::error::No Linux viewer package was found."
            find build-linux-x86_64/newview -maxdepth 1 -type f -print || true
            exit 1
          fi

          echo "LINUX_PACKAGE=$PACKAGE" >> "$GITHUB_ENV"
          echo "path=$PACKAGE" >> "$GITHUB_OUTPUT"
          echo "Linux package: $PACKAGE"

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tasia-Viewer-Linux-FMOD
          if-no-files-found: error
          path: ${{ steps.linux-package.outputs.path }}

      - name: Publish GitHub pre-release
        if: inputs.publish_release == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          TAG="v${TASIA_DISPLAY_VERSION}-linux"
          TITLE="Tasia Viewer ${TASIA_DISPLAY_VERSION} Linux Beta"
          NOTES="$(mktemp)"

          cat > "$NOTES" <<EOF
          Tasia Viewer Linux beta build.

          Version: ${TASIA_DISPLAY_VERSION}
          Source branch: ${SOURCE_BRANCH}
          Source commit: ${SOURCE_SHORT_SHA}
          Platform: Linux x86_64
          FMOD: enabled
          KDU: disabled

          This is a beta/pre-release build.
          EOF

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$LINUX_PACKAGE" \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          else
            gh release create "$TAG" "$LINUX_PACKAGE" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$SOURCE_SHA" \
              --title "$TITLE" \
              --notes-file "$NOTES" \
              --prerelease
          fi
