name: Build Tasia Viewer - Windows

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publish GitHub pre-release"
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  AUTOBUILD_ADDRSIZE: 64
  AUTOBUILD_BUILD_ID: ${{ github.run_id }}
  AUTOBUILD_INSTALLABLE_CACHE: ${{ github.workspace }}/.autobuild-installables
  AUTOBUILD_VARIABLES_FILE: ${{ github.workspace }}/.build-variables/variables
  AUTOBUILD_VCS_INFO: "true"
  AUTOBUILD_VSVER: 170
  LL_SKIP_REQUIRE_SYSROOT: 1
  XZ_DEFAULTS: -T0
  BUILD_VARIABLES_REF: c17312d38377c003977cf5b6dcc83c6042eba194
  FMOD_RELEASE_TAG: fmod-20307

jobs:
  build:
    name: Build Tasia Viewer - Windows - FMOD
    runs-on: windows-2022
    timeout-minutes: 240

    steps:
      - name: Checkout Windows stable source
        uses: actions/checkout@v4
        with:
          ref: tasia_windows_os_stable
          fetch-depth: 0

      - name: Record source metadata
        shell: bash
        run: |
          set -euo pipefail

          SOURCE_SHA="$(git rev-parse HEAD)"
          SOURCE_SHORT_SHA="${SOURCE_SHA:0:7}"
          VIEWER_VERSION_BASE="$(tr -d '\r\n' < indra/newview/VIEWER_VERSION.txt)"

          if [[ ! "$VIEWER_VERSION_BASE" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid viewer version: $VIEWER_VERSION_BASE"
            exit 1
          fi

          {
            echo "SOURCE_BRANCH=tasia_windows_os_stable"
            echo "SOURCE_SHA=$SOURCE_SHA"
            echo "SOURCE_SHORT_SHA=$SOURCE_SHORT_SHA"
            echo "VIEWER_VERSION_BASE=$VIEWER_VERSION_BASE"
            echo "TASIA_DISPLAY_VERSION=${VIEWER_VERSION_BASE}.${GITHUB_RUN_NUMBER}"
            echo "TASIA_BUILD_NUMBER=${GITHUB_RUN_NUMBER}"
            echo "TASIA_SHORT_SHA=$SOURCE_SHORT_SHA"
            echo "VIEWER_VERSION_GITHASH=$SOURCE_SHA"
            echo "revision=${GITHUB_RUN_NUMBER}"
          } >> "$GITHUB_ENV"

          echo "Building tasia_windows_os_stable at $SOURCE_SHA"
          echo "Viewer version: ${VIEWER_VERSION_BASE}.${GITHUB_RUN_NUMBER}"

      - name: Preserve GitHub build number
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          path = Path("scripts/configure_firestorm.sh")
          text = path.read_text(encoding="utf-8")

          old = (
              "    buildVer=$(git rev-list --count HEAD)\n"
              "    export revision=${buildVer}"
          )
          new = (
              '    buildVer="${revision:-$(git rev-list --count HEAD)}"\n'
              '    export revision="${buildVer}"'
          )

          if old not in text:
              raise SystemExit(
                  "Expected revision block was not found in scripts/configure_firestorm.sh"
              )

          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pinned Python build tools
        shell: bash
        run: |
          set -euo pipefail

          python -m pip install --upgrade pip
          python -m pip install \
            "autobuild==3.10.2" \
            "llbase==1.3.1" \
            "llsd==1.2.4"

          PYTHON_PATH="$(python -c 'import sys; print(sys.executable)')"
          echo "PYTHON=$PYTHON_PATH" >> "$GITHUB_ENV"

          python --version
          autobuild --version
          python -m pip check

      - name: Checkout pinned build variables
        uses: actions/checkout@v4
        with:
          repository: FirestormViewer/fs-build-variables
          ref: ${{ env.BUILD_VARIABLES_REF }}
          path: .build-variables

      - name: Restore autobuild installables cache
        uses: actions/cache@v4
        with:
          path: ${{ env.AUTOBUILD_INSTALLABLE_CACHE }}
          key: autobuild-windows-${{ env.FMOD_RELEASE_TAG }}-${{ hashFiles('autobuild.xml') }}
          restore-keys: |
            autobuild-windows-${{ env.FMOD_RELEASE_TAG }}-
            autobuild-windows-

      - name: Download private FMOD autobuild package
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.FMOD_DEPS_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::FMOD_DEPS_TOKEN secret is missing."
            exit 1
          fi

          rm -rf private-deps
          mkdir -p private-deps

          gh release download "$FMOD_RELEASE_TAG" \
            --repo martysl/tasia-private-deps \
            --pattern "*windows64*.tar.bz2" \
            --dir private-deps

          FMOD_PACKAGE="$(
            find private-deps \
              -maxdepth 1 \
              -type f \
              -name '*windows64*.tar.bz2' \
              -print -quit
          )"

          if [ -z "$FMOD_PACKAGE" ]; then
            echo "::error::FMOD Windows autobuild package was not downloaded."
            exit 1
          fi

          tar -tjf "$FMOD_PACKAGE" >/dev/null

          FMOD_HASH="$(
            python3 -c \
              "import hashlib,sys; print(hashlib.md5(open(sys.argv[1],'rb').read()).hexdigest())" \
              "$FMOD_PACKAGE"
          )"

          FMOD_FILE_URL="$(
            python3 -c \
              "import pathlib,sys; print(pathlib.Path(sys.argv[1]).resolve().as_uri())" \
              "$FMOD_PACKAGE"
          )"

          {
            echo "FMOD_PLATFORM=windows64"
            echo "FMOD_PACKAGE=$FMOD_PACKAGE"
            echo "FMOD_HASH=$FMOD_HASH"
            echo "FMOD_FILE_URL=$FMOD_FILE_URL"
          } >> "$GITHUB_ENV"

          echo "Using FMOD package: $FMOD_PACKAGE"
          echo "FMOD MD5: $FMOD_HASH"

      - name: Point autobuild to private FMOD package
        shell: bash
        run: |
          set -euo pipefail

          autobuild installables edit fmodstudio \
            platform="$FMOD_PLATFORM" \
            hash="$FMOD_HASH" \
            url="$FMOD_FILE_URL"

      - name: Load autobuild environment
        shell: bash
        run: |
          set -eo pipefail

          autobuild source_environment > .source_env
          source .source_env

          {
            echo "LL_BUILD=${LL_BUILD:-}"
            echo "LL_BUILD_RELEASE=${LL_BUILD_RELEASE:-}"
          } >> "$GITHUB_ENV"

      - name: Configure Windows with FMOD and OpenSim
        shell: bash
        env:
          TASIA_GIPHY_API_KEY: ${{ secrets.TASIA_GIPHY_API_KEY }}
        run: |
          set -euo pipefail

          autobuild configure \
            -c ReleaseFS_open \
            -A 64 \
            -- \
            --opensim \
            --fmodstudio \
            --no-package \
            -DLL_TESTS:BOOL=FALSE || {
              echo "===== FIRESTORM CMAKE CONFIGURE LOG ====="

              if [ -f "build-vc170-64/CMakeFiles/CMakeConfigureLog.yaml" ]; then
                cat "build-vc170-64/CMakeFiles/CMakeConfigureLog.yaml"
              fi

              if [ -f "build-vc170-64/CMakeFiles/CMakeError.log" ]; then
                cat "build-vc170-64/CMakeFiles/CMakeError.log"
              fi

              exit 1
            }

      - name: Build Windows with FMOD and OpenSim
        shell: bash
        run: |
          set -euo pipefail

          autobuild build \
            -c ReleaseFS_open \
            -A 64 \
            --no-configure

      - name: Prepare portable Windows runtime
        shell: bash
        run: |
          set -euo pipefail

          DIST_DIR="build-vc170-64/newview/Release"

          if [ ! -d "$DIST_DIR" ]; then
            echo "::error::Missing Windows runtime directory: $DIST_DIR"
            find build-vc170-64/newview -maxdepth 2 -type d -print 2>/dev/null || true
            exit 1
          fi

          if [ ! -d "$DIST_DIR/app_settings" ] || [ ! -d "$DIST_DIR/skins" ]; then
            echo "::error::Runtime directory is incomplete."
            find "$DIST_DIR" -maxdepth 2 -type f -print 2>/dev/null | head -200 || true
            exit 1
          fi

          if ! find "$DIST_DIR" -maxdepth 1 -type f -iname '*.exe' -print -quit | grep -q .; then
            echo "::error::No viewer executable found in $DIST_DIR"
            exit 1
          fi

          if [ ! -f "$DIST_DIR/msquic.dll" ]; then
            MSQUIC_DLL="$(
              find build-vc170-64/_deps \
                -type f \
                -iname 'msquic.dll' \
                -path '*/bin/Release/*' \
                -print -quit 2>/dev/null || true
            )"

            if [ -z "$MSQUIC_DLL" ]; then
              MSQUIC_DLL="$(
                find build-vc170-64/_deps \
                  -type f \
                  -iname 'msquic.dll' \
                  -print -quit 2>/dev/null || true
              )"
            fi

            if [ -z "$MSQUIC_DLL" ]; then
              echo "::error::Could not find msquic.dll."
              exit 1
            fi

            cp -v "$MSQUIC_DLL" "$DIST_DIR/msquic.dll"
          fi

          echo "Portable runtime prepared in $DIST_DIR"
          find "$DIST_DIR" -maxdepth 1 -type f -printf '%f\n' | sort

      - name: Create portable Windows ZIP
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZIP_DEFLATED, ZipFile

          source = Path("build-vc170-64/newview/Release")
          output = Path("Tasia-Viewer-Windows-FMOD.zip")

          if not source.is_dir():
              raise SystemExit(f"Missing runtime directory: {source}")

          excluded_names = {
              "firestorm-bin.exe",
              "secondlife-bin.exe",
              "copy_touched.bat",
              "touched.bat",
          }
          excluded_suffixes = {
              ".exp",
              ".ilk",
              ".lib",
              ".map",
              ".nsi",
              ".pdb",
          }

          files_added = 0

          with ZipFile(output, "w", compression=ZIP_DEFLATED, compresslevel=9) as archive:
              for file in sorted(source.rglob("*")):
                  if not file.is_file():
                      continue

                  relative = file.relative_to(source)
                  lower_name = file.name.lower()
                  lower_parts = tuple(part.lower() for part in relative.parts)

                  if lower_name in excluded_names:
                      continue
                  if file.suffix.lower() in excluded_suffixes:
                      continue
                  if lower_name.endswith("_setup.exe") or lower_name.endswith("-setup.exe"):
                      continue
                  if lower_name.endswith(".tar.xz") or lower_name.endswith(".tar.bz2"):
                      continue
                  if "installers" in lower_parts:
                      continue

                  archive.write(file, relative.as_posix())
                  files_added += 1

          if files_added == 0:
              output.unlink(missing_ok=True)
              raise SystemExit("Portable ZIP would be empty.")

          print(f"Created {output} with {files_added} runtime files.")
          PY

      - name: Verify portable ZIP
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          archive_path = Path("Tasia-Viewer-Windows-FMOD.zip")

          if not archive_path.is_file():
              raise SystemExit(f"Missing archive: {archive_path}")

          with ZipFile(archive_path) as archive:
              bad = [
                  name for name in archive.namelist()
                  if name.lower().endswith(("_setup.exe", "-setup.exe", ".nsi"))
                  or "/installers/" in f"/{name.lower()}"
              ]

              if bad:
                  raise SystemExit(
                      "Installer content found in portable ZIP:\n" + "\n".join(bad)
                  )

              names = archive.namelist()
              if not any(name.lower().endswith(".exe") for name in names):
                  raise SystemExit("Portable ZIP contains no executable.")
              if not any(name.lower() == "msquic.dll" for name in names):
                  raise SystemExit("Portable ZIP is missing msquic.dll.")

              print(f"Verified {len(names)} files in {archive_path}.")
          PY

      - name: Upload portable Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tasia-Viewer-Windows-FMOD
          if-no-files-found: error
          path: Tasia-Viewer-Windows-FMOD.zip

      - name: Publish GitHub pre-release
        if: inputs.publish_release == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          TAG="v${TASIA_DISPLAY_VERSION}-windows"
          TITLE="Tasia Viewer ${TASIA_DISPLAY_VERSION} Windows Beta"
          NOTES="$(mktemp)"

          cat > "$NOTES" <<EOF
          Tasia Viewer Windows portable beta build.

          Version: ${TASIA_DISPLAY_VERSION}
          Source branch: ${SOURCE_BRANCH}
          Source commit: ${SOURCE_SHORT_SHA}
          Platform: Windows x86_64
          Format: portable ZIP
          FMOD: enabled
          OpenSim: enabled
          KDU: disabled
          Installer: not included

          This is a beta/pre-release build.
          EOF

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" Tasia-Viewer-Windows-FMOD.zip \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          else
            gh release create "$TAG" Tasia-Viewer-Windows-FMOD.zip \
              --repo "$GITHUB_REPOSITORY" \
              --target "$SOURCE_SHA" \
              --title "$TITLE" \
              --notes-file "$NOTES" \
              --prerelease
          fi
